<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestion des Sociétés</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="shared.js" defer></script>
</head>
<body class="bg-slate-100 text-slate-900">
  <div class="min-h-screen">
    <header class="bg-slate-800 text-white p-6 shadow">
      <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <h1 class="text-3xl font-semibold">Gestion des Sociétés</h1>
          <p class="text-slate-200">CRUD, listing et navigation vers toutes les sections.</p>
        </div>
        <nav class="flex flex-wrap gap-3">
          <a href="index.html" class="px-4 py-2 bg-slate-700 rounded hover:bg-slate-600">Accueil</a>
          <a href="agences.html" class="px-4 py-2 bg-slate-700 rounded hover:bg-slate-600">Agences</a>
          <a href="users.html" class="px-4 py-2 bg-slate-700 rounded hover:bg-slate-600">Utilisateurs</a>
          <a href="client-totines.html" class="px-4 py-2 bg-slate-700 rounded hover:bg-slate-600">Clients</a>
        </nav>
      </div>
    </header>

    <main class="max-w-7xl mx-auto p-6" x-data="entityManager('societies', { nom: '', raisonSociale: '', identifiant: '', email: '', telephone: '', adresse: '' }, ['id', 'nom', 'identifiant', 'email', 'telephone'])" x-init="loadList()">
      <section class="grid gap-6 lg:grid-cols-[2fr_1fr]">
        <div class="space-y-6">
          <div class="bg-white p-6 rounded-xl shadow-sm">
            <h2 class="text-xl font-semibold mb-4">Liste des sociétés</h2>
            <template x-if="error">
              <div class="mb-4 rounded border border-red-300 bg-red-50 p-4 text-red-700">{{ error }}</div>
            </template>
            <template x-if="message">
              <div class="mb-4 rounded border border-emerald-300 bg-emerald-50 p-4 text-emerald-700">{{ message }}</div>
            </template>
            <div class="overflow-x-auto">
              <table class="min-w-full text-left text-sm">
                <thead class="bg-slate-100 text-slate-600 uppercase text-xs tracking-wider">
                  <tr>
                    <th class="px-4 py-3">ID</th>
                    <th class="px-4 py-3">Nom</th>
                    <th class="px-4 py-3">Identifiant</th>
                    <th class="px-4 py-3">Email</th>
                    <th class="px-4 py-3">Téléphone</th>
                    <th class="px-4 py-3">Actions</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200">
                  <template x-for="item in items" :key="item.id">
                    <tr class="hover:bg-slate-50">
                      <td class="px-4 py-3">{{ item.id }}</td>
                      <td class="px-4 py-3">{{ item.nom }}</td>
                      <td class="px-4 py-3">{{ item.identifiant }}</td>
                      <td class="px-4 py-3">{{ item.email ?? '—' }}</td>
                      <td class="px-4 py-3">{{ item.telephone ?? '—' }}</td>
                      <td class="px-4 py-3 space-x-2">
                        <button @click="selectItem(item)" class="rounded bg-slate-700 px-3 py-1 text-white hover:bg-slate-600">Edit</button>
                        <button @click="deleteItem(item.id)" class="rounded bg-rose-600 px-3 py-1 text-white hover:bg-rose-500">Suppr</button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>

          <div class="bg-white p-6 rounded-xl shadow-sm">
            <h2 class="text-xl font-semibold mb-4">Sélection</h2>
            <template x-if="selected">
              <div>
                <p class="text-slate-700">ID sélectionné : <strong x-text="selected.id"></strong></p>
                <pre class="mt-3 overflow-auto rounded bg-slate-100 p-3 text-xs text-slate-700">{{ JSON.stringify(selected, null, 2) }}</pre>
              </div>
            </template>
            <template x-if="!selected">
              <p class="text-slate-500">Aucun élément sélectionné.</p>
            </template>
          </div>
        </div>

        <div class="space-y-6">
          <div class="bg-white p-6 rounded-xl shadow-sm">
            <h2 class="text-xl font-semibold mb-4">Formulaire de création / mise à jour</h2>
            <div class="grid gap-4">
              <label class="space-y-2 text-sm">
                <span>Nom</span>
                <input x-model="form.nom" type="text" class="w-full rounded border border-slate-300 px-3 py-2" />
              </label>
              <label class="space-y-2 text-sm">
                <span>Raison sociale</span>
                <input x-model="form.raisonSociale" type="text" class="w-full rounded border border-slate-300 px-3 py-2" />
              </label>
              <label class="space-y-2 text-sm">
                <span>Identifiant</span>
                <input x-model="form.identifiant" type="text" class="w-full rounded border border-slate-300 px-3 py-2" />
              </label>
              <label class="space-y-2 text-sm">
                <span>Email</span>
                <input x-model="form.email" type="email" class="w-full rounded border border-slate-300 px-3 py-2" />
              </label>
              <label class="space-y-2 text-sm">
                <span>Téléphone</span>
                <input x-model="form.telephone" type="text" class="w-full rounded border border-slate-300 px-3 py-2" />
              </label>
              <label class="space-y-2 text-sm">
                <span>Adresse</span>
                <textarea x-model="form.adresse" rows="3" class="w-full rounded border border-slate-300 px-3 py-2"></textarea>
              </label>
            </div>
            <div class="mt-5 flex flex-wrap gap-3">
              <button @click="createItem()" class="rounded bg-slate-800 px-5 py-2 text-white hover:bg-slate-700">Créer</button>
              <button @click="updateItem()" class="rounded bg-emerald-600 px-5 py-2 text-white hover:bg-emerald-500">Mettre à jour</button>
              <button @click="clearSelection()" class="rounded border border-slate-300 px-5 py-2 text-slate-700 hover:bg-slate-50">Réinitialiser</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
