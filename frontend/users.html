<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestion des Utilisateurs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="/app/shared.js" defer></script>
</head>
<body class="bg-slate-100 text-slate-900">
  <div class="min-h-screen">
    <header class="bg-slate-800 text-white p-6 shadow">
      <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <h1 class="text-3xl font-semibold">Gestion des Utilisateurs</h1>
          <p class="text-slate-200">CRUD, liste et navigation avec les différentes entités.</p>
        </div>
        <nav class="flex flex-wrap gap-3">
          <a href="index.html" class="px-4 py-2 bg-slate-700 rounded hover:bg-slate-600">Accueil</a>
          <a href="societes.html" class="px-4 py-2 bg-slate-700 rounded hover:bg-slate-600">Sociétés</a>
          <a href="agences.html" class="px-4 py-2 bg-slate-700 rounded hover:bg-slate-600">Agences</a>
          <a href="client-totines.html" class="px-4 py-2 bg-slate-700 rounded hover:bg-slate-600">Clients</a>
        </nav>
      </div>
    </header>

    <main class="max-w-7xl mx-auto p-6" x-data="entityManager('users', { nom: '', email: '', motDePasseHash: '', telephone: '', role: 'CAISSIER', societeId: '', agenceId: '' }, ['id', 'nom', 'email', 'role', 'societeId', 'agenceId'])" x-init="loadList()">
      <section class="grid gap-6 lg:grid-cols-[2fr_1fr]">
        <div class="space-y-6">
          <div class="bg-white p-6 rounded-xl shadow-sm">
            <h2 class="text-xl font-semibold mb-4">Liste des utilisateurs</h2>
            <template x-if="error">
              <div class="mb-4 rounded border border-red-300 bg-red-50 p-4 text-red-700">{{ error }}</div>
            </template>
            <template x-if="message">
              <div class="mb-4 rounded border border-emerald-300 bg-emerald-50 p-4 text-emerald-700">{{ message }}</div>
            </template>
            <div class="overflow-x-auto">
              <table class="min-w-full text-left text-sm">
                <thead class="bg-slate-100 text-slate-600 uppercase text-xs tracking-wider">
                  <tr>
                    <th class="px-4 py-3">ID</th>
                    <th class="px-4 py-3">Nom</th>
                    <th class="px-4 py-3">Email</th>
                    <th class="px-4 py-3">Rôle</th>
                    <th class="px-4 py-3">Société</th>
                    <th class="px-4 py-3">Agence</th>
                    <th class="px-4 py-3">Actions</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200">
                  <template x-for="item in items" :key="item.id">
                    <tr class="hover:bg-slate-50">
                      <td class="px-4 py-3">{{ item.id }}</td>
                      <td class="px-4 py-3">{{ item.nom }}</td>
                      <td class="px-4 py-3">{{ item.email }}</td>
                      <td class="px-4 py-3">{{ item.role }}</td>
                      <td class="px-4 py-3">{{ item.societeId ?? '—' }}</td>
                      <td class="px-4 py-3">{{ item.agenceId ?? '—' }}</td>
                      <td class="px-4 py-3 space-x-2">
                        <button @click="selectItem(item)" class="rounded bg-slate-700 px-3 py-1 text-white hover:bg-slate-600">Edit</button>
                        <button @click="deleteItem(item.id)" class="rounded bg-rose-600 px-3 py-1 text-white hover:bg-rose-500">Suppr</button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>

          <div class="bg-white p-6 rounded-xl shadow-sm">
            <h2 class="text-xl font-semibold mb-4">Détail sélectionné</h2>
            <template x-if="selected">
              <div>
                <pre class="overflow-auto rounded bg-slate-100 p-3 text-xs text-slate-700">{{ JSON.stringify(selected, null, 2) }}</pre>
              </div>
            </template>
            <template x-if="!selected">
              <p class="text-slate-500">Sélectionnez un utilisateur pour afficher les détails.</p>
            </template>
          </div>
        </div>

        <div class="space-y-6">
          <div class="bg-white p-6 rounded-xl shadow-sm">
            <h2 class="text-xl font-semibold mb-4">Formulaire utilisateur</h2>
            <div class="grid gap-4">
              <label class="space-y-2 text-sm">
                <span>Nom</span>
                <input x-model="form.nom" type="text" class="w-full rounded border border-slate-300 px-3 py-2" />
              </label>
              <label class="space-y-2 text-sm">
                <span>Email</span>
                <input x-model="form.email" type="email" class="w-full rounded border border-slate-300 px-3 py-2" />
              </label>
              <label class="space-y-2 text-sm">
                <span>Mot de passe</span>
                <input x-model="form.motDePasseHash" type="password" class="w-full rounded border border-slate-300 px-3 py-2" />
              </label>
              <label class="space-y-2 text-sm">
                <span>Téléphone</span>
                <input x-model="form.telephone" type="text" class="w-full rounded border border-slate-300 px-3 py-2" />
              </label>
              <label class="space-y-2 text-sm">
                <span>Rôle</span>
                <select x-model="form.role" class="w-full rounded border border-slate-300 px-3 py-2">
                  <option value="ADMIN">ADMIN</option>
                  <option value="CAISSIER">CAISSIER</option>
                  <option value="COLLECTEUR">COLLECTEUR</option>
                </select>
              </label>
              <label class="space-y-2 text-sm">
                <span>Société ID</span>
                <input x-model="form.societeId" type="number" class="w-full rounded border border-slate-300 px-3 py-2" />
              </label>
              <label class="space-y-2 text-sm">
                <span>Agence ID</span>
                <input x-model="form.agenceId" type="number" class="w-full rounded border border-slate-300 px-3 py-2" />
              </label>
            </div>
            <div class="mt-5 flex flex-wrap gap-3">
              <button @click="createItem()" class="rounded bg-slate-800 px-5 py-2 text-white hover:bg-slate-700">Créer</button>
              <button @click="updateItem()" class="rounded bg-emerald-600 px-5 py-2 text-white hover:bg-emerald-500">Mettre à jour</button>
              <button @click="clearSelection()" class="rounded border border-slate-300 px-5 py-2 text-slate-700 hover:bg-slate-50">Réinitialiser</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
