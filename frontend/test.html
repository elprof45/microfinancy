<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Frontend</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900">
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-xl rounded-3xl bg-white p-8 shadow-lg">
      <h1 class="text-3xl font-semibold mb-4">Test de connectivité frontend</h1>
      <p class="text-slate-600 mb-6">Cette page vérifie si le serveur backend et le fichier shared.js sont accessibles.</p>
      <div id="results" class="space-y-4 text-sm"></div>
      <button id="runTest" class="mt-6 inline-flex items-center justify-center rounded-xl bg-slate-900 px-5 py-3 text-white hover:bg-slate-700">Exécuter le test</button>
    </div>
  </div>

  <script>
    const results = document.getElementById('results')
    const addResult = (text, ok) => {
      const line = document.createElement('div')
      line.className = ok ? 'rounded border border-emerald-200 bg-emerald-50 p-3 text-emerald-900' : 'rounded border border-rose-200 bg-rose-50 p-3 text-rose-900'
      line.textContent = text
      results.appendChild(line)
    }

    document.getElementById('runTest').addEventListener('click', async () => {
      results.innerHTML = ''
      try {
        const res = await fetch('/societies')
        addResult(`/societies status: ${res.status}`, res.ok)
        if (res.ok) {
          const json = await res.json()
          addResult(`✅ /societies renvoie ${Array.isArray(json) ? json.length + ' sociétés' : 'une réponse'}`, true)
        }
      } catch (err) {
        addResult(`❌ Échec fetch /societies : ${err.message}`, false)
      }

      try {
        const res = await fetch('/app/shared.js')
        addResult(`/app/shared.js status: ${res.status}`, res.ok)
        const text = await res.text()
        addResult(text.includes('window.entityManager') ? '✅ shared.js chargé' : '❌ shared.js contenu invalide', res.ok && text.includes('window.entityManager'))
      } catch (err) {
        addResult(`❌ Échec fetch /app/shared.js : ${err.message}`, false)
      }
    })
  </script>
</body>
</html>
