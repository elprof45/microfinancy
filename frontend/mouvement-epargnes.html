<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestion des Mouvements Épargne</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="shared.js" defer></script>
</head>
<body class="bg-slate-100 text-slate-900">
  <div class="min-h-screen">
    <header class="bg-slate-800 text-white p-6 shadow">
      <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <h1 class="text-3xl font-semibold">Gestion des Mouvements Épargne</h1>
          <p class="text-slate-200">CRUD, stats et historique des mouvements d'épargne.</p>
        </div>
        <nav class="flex flex-wrap gap-3">
          <a href="index.html" class="px-4 py-2 bg-slate-700 rounded hover:bg-slate-600">Accueil</a>
          <a href="comptes.html" class="px-4 py-2 bg-slate-700 rounded hover:bg-slate-600">Comptes</a>
          <a href="mouvement-items.html" class="px-4 py-2 bg-slate-700 rounded hover:bg-slate-600">Mouvement Items</a>
          <a href="cotisations.html" class="px-4 py-2 bg-slate-700 rounded hover:bg-slate-600">Cotisations</a>
        </nav>
      </div>
    </header>

    <main class="max-w-7xl mx-auto p-6" x-data="entityManager('mouvement-epargnes', { reference: '', type: 'VERSEMENT', montant: '', soldeAvant: '', soldeApres: '', dateMouvement: '', statut: 'EN_ATTENTE', observations: '', agenceId: '', clientId: '', compteId: '', creeParId: '', valideParId: '' }, ['id', 'reference', 'type', 'montant', 'statut', 'agenceId', 'clientId'], { stats: true, history: true })" x-init="loadList()">
      <section class="grid gap-6 lg:grid-cols-[2fr_1fr]">
        <div class="space-y-6">
          <div class="bg-white p-6 rounded-xl shadow-sm">
            <h2 class="text-xl font-semibold mb-4">Liste des mouvements épargne</h2>
            <template x-if="error">
              <div class="mb-4 rounded border border-red-300 bg-red-50 p-4 text-red-700">{{ error }}</div>
            </template>
            <template x-if="message">
              <div class="mb-4 rounded border border-emerald-300 bg-emerald-50 p-4 text-emerald-700">{{ message }}</div>
            </template>
            <div class="overflow-x-auto">
              <table class="min-w-full text-left text-sm">
                <thead class="bg-slate-100 text-slate-600 uppercase text-xs tracking-wider">
                  <tr>
                    <th class="px-4 py-3">ID</th>
                    <th class="px-4 py-3">Référence</th>
                    <th class="px-4 py-3">Type</th>
                    <th class="px-4 py-3">Montant</th>
                    <th class="px-4 py-3">Statut</th>
                    <th class="px-4 py-3">Actions</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200">
                  <template x-for="item in items" :key="item.id">
                    <tr class="hover:bg-slate-50">
                      <td class="px-4 py-3">{{ item.id }}</td>
                      <td class="px-4 py-3">{{ item.reference }}</td>
                      <td class="px-4 py-3">{{ item.type }}</td>
                      <td class="px-4 py-3">{{ item.montant }}</td>
                      <td class="px-4 py-3">{{ item.statut }}</td>
                      <td class="px-4 py-3 space-x-2">
                        <button @click="selectItem(item)" class="rounded bg-slate-700 px-3 py-1 text-white hover:bg-slate-600">Edit</button>
                        <button @click="deleteItem(item.id)" class="rounded bg-rose-600 px-3 py-1 text-white hover:bg-rose-500">Suppr</button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>

          <div class="bg-white p-6 rounded-xl shadow-sm">
            <h2 class="text-xl font-semibold mb-4">Stats & historique</h2>
            <template x-if="selected">
              <div class="space-y-4">
                <button @click="loadStats(selected.id)" class="rounded bg-slate-800 px-4 py-2 text-white hover:bg-slate-700">Charger stats</button>
                <button @click="loadHistory(selected.id)" class="rounded bg-slate-600 px-4 py-2 text-white hover:bg-slate-500">Charger historique</button>
                <template x-if="stats">
                  <div class="rounded border border-slate-200 bg-slate-50 p-4">
                    <h3 class="font-semibold mb-2">Stats</h3>
                    <pre class="text-xs text-slate-700">{{ JSON.stringify(stats, null, 2) }}</pre>
                  </div>
                </template>
                <template x-if="history">
                  <div class="rounded border border-slate-200 bg-slate-50 p-4">
                    <h3 class="font-semibold mb-2">Historique</h3>
                    <pre class="text-xs text-slate-700">{{ JSON.stringify(history, null, 2) }}</pre>
                  </div>
                </template>
              </div>
            </template>
            <template x-if="!selected">
              <p class="text-slate-500">Sélectionnez un mouvement pour afficher les données.</p>
            </template>
          </div>
        </div>

        <div class="space-y-6">
          <div class="bg-white p-6 rounded-xl shadow-sm">
            <h2 class="text-xl font-semibold mb-4">Formulaire mouvement</h2>
            <div class="grid gap-4">
              <label class="space-y-2 text-sm">
                <span>Référence</span>
                <input x-model="form.reference" type="text" class="w-full rounded border border-slate-300 px-3 py-2" />
              </label>
              <label class="space-y-2 text-sm">
                <span>Type</span>
                <select x-model="form.type" class="w-full rounded border border-slate-300 px-3 py-2">
                  <option>VERSEMENT</option>
                  <option>RETRAIT</option>
                  <option>DEPOT</option>
                </select>
              </label>
              <label class="space-y-2 text-sm">
                <span>Montant</span>
                <input x-model="form.montant" type="number" class="w-full rounded border border-slate-300 px-3 py-2" />
              </label>
              <label class="space-y-2 text-sm">
                <span>Solde avant</span>
                <input x-model="form.soldeAvant" type="number" class="w-full rounded border border-slate-300 px-3 py-2" />
              </label>
              <label class="space-y-2 text-sm">
                <span>Solde après</span>
                <input x-model="form.soldeApres" type="number" class="w-full rounded border border-slate-300 px-3 py-2" />
              </label>
              <label class="space-y-2 text-sm">
                <span>Date mouvement</span>
                <input x-model="form.dateMouvement" type="datetime-local" class="w-full rounded border border-slate-300 px-3 py-2" />
              </label>
              <label class="space-y-2 text-sm">
                <span>Statut</span>
                <select x-model="form.statut" class="w-full rounded border border-slate-300 px-3 py-2">
                  <option>EN_ATTENTE</option>
                  <option>VALIDE</option>
                  <option>REJETE</option>
                  <option>ANNULE</option>
                  <option>REMBOURSE</option>
                </select>
              </label>
              <label class="space-y-2 text-sm">
                <span>Observations</span>
                <textarea x-model="form.observations" rows="3" class="w-full rounded border border-slate-300 px-3 py-2"></textarea>
              </label>
              <label class="space-y-2 text-sm">
                <span>ID Agence</span>
                <input x-model="form.agenceId" type="number" class="w-full rounded border border-slate-300 px-3 py-2" />
              </label>
              <label class="space-y-2 text-sm">
                <span>ID Client</span>
                <input x-model="form.clientId" type="number" class="w-full rounded border border-slate-300 px-3 py-2" />
              </label>
              <label class="space-y-2 text-sm">
                <span>ID Compte</span>
                <input x-model="form.compteId" type="number" class="w-full rounded border border-slate-300 px-3 py-2" />
              </label>
              <label class="space-y-2 text-sm">
                <span>ID Créé par</span>
                <input x-model="form.creeParId" type="number" class="w-full rounded border border-slate-300 px-3 py-2" />
              </label>
              <label class="space-y-2 text-sm">
                <span>ID Validé par</span>
                <input x-model="form.valideParId" type="number" class="w-full rounded border border-slate-300 px-3 py-2" />
              </label>
            </div>
            <div class="mt-5 flex flex-wrap gap-3">
              <button @click="createItem()" class="rounded bg-slate-800 px-5 py-2 text-white hover:bg-slate-700">Créer</button>
              <button @click="updateItem()" class="rounded bg-emerald-600 px-5 py-2 text-white hover:bg-emerald-500">Mettre à jour</button>
              <button @click="clearSelection()" class="rounded border border-slate-300 px-5 py-2 text-slate-700 hover:bg-slate-50">Réinitialiser</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
